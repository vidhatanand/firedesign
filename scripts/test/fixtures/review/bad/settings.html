<!doctype html>
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Ember</title>
<link rel="stylesheet" href="../../../../../fire/fire.css">
<script type="module" src="../../../../../fire/fire.js"></script>
</head>
<body>
<main class="fd-page">
  <div class="fd-frame">
    <section class="fd-band fd-page-hero">
      <h1 class="fd-display">Settings</h1>
      <p class="fd-page-hero-desc">Your account and how it uses Ember.</p>
    </section>
    <section class="fd-band" aria-label="Notifications">
      <div class="fd-card fd-stack">
        <div class="fd-card-head"><span class="fd-card-name">Usage alerts</span></div>
        <p class="fd-card-desc">Email the team when the month passes 80% of its credits.</p>
        <button class="fd-btn" type="button" data-variant="primary">Save alerts</button>
      </div>
    </section>
  </div>
</main>
</body>
</html>
