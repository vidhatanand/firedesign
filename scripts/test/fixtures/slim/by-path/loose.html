<!doctype html>
<!-- A page that hands Fire's namespace to a function: no member can be read, so every module stays. -->
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Ember</title>
<link rel="stylesheet" href="/fire/fire.css">
<script type="module">
  import * as Fire from '/fire/fire.js';
  window.register(Fire);
</script>
</head>
<body>
<main><button class="fd-btn" type="button">Save</button></main>
</body>
</html>
