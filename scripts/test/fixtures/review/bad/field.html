<!doctype html>
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Ember</title>
<link rel="stylesheet" href="../../../../../fire/fire.css">
<script type="module" src="../../../../../fire/fire.js"></script>
</head>
<body>
<main class="fd-page">
  <div class="fd-frame">
    <section class="fd-band fd-page-hero">
      <h1 class="fd-display">Profile</h1>
      <p class="fd-page-hero-desc">How your name appears to the team.</p>
    </section>
    <section class="fd-band" aria-label="Display name">
      <div class="fd-card">
        <div class="fd-setting">
          <div class="fd-setting-text">
            <div class="fd-setting-title">Display name</div>
            <div class="fd-setting-desc">Shown on runs and in the audit log.</div>
            <input class="fd-input" type="text" value="Maya Chen" aria-label="Display name" autocomplete="off">
          </div>
          <div class="fd-setting-control"><button class="fd-btn" type="button">Save</button></div>
        </div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
