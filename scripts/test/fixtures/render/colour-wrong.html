<!doctype html><html lang="en"><head><meta charset="utf-8"><title>colour: different colours</title><style>i{display:block;height:12px;width:80px}</style></head><body><main class="fd-page">
  <i class="fd-swatch" style="color:color-mix(in srgb,#262626 68%,transparent)"></i>
  <i class="fd-swatch" style="background-color:color(srgb 0.149020 0.149020 0.149020)"></i>
  <i class="fd-swatch" style="background-color:color-mix(in srgb,#262626 1.4%,transparent)"></i>
