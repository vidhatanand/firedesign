<!doctype html>
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register an app · Ember</title>
<link rel="stylesheet" href="../../../../../fire/fire.css">
<script type="module" src="../../../../../fire/fire.js"></script>
</head>
<body>
<main class="fd-page">
  <div class="fd-frame">
    <section class="fd-band fd-page-hero">
      <h1 class="fd-display">Register an app</h1>
      <p class="fd-page-hero-desc">Let people sign in to your app through Ember.</p>
    </section>
    <section class="fd-band" aria-label="Register an app">
      <form class="fd-form" data-size="full" id="register-app">
        <div class="fd-callout" data-tone="danger" role="alert" id="ap-error" hidden>
          <i class="fd-callout-icon" data-icon="circle-alert"></i>
          <div class="fd-callout-content">
            <p class="fd-callout-title">Couldn’t register the app</p>
            <p class="fd-callout-body">Another app already uses this name. Nothing was saved.</p>
          </div>
        </div>
        <section class="fd-form-section" aria-labelledby="ap-title">
          <header class="fd-form-section-head">
            <h2 class="fd-form-section-title" id="ap-title">App</h2>
            <p class="fd-form-section-desc">What people see when they sign in.</p>
          </header>
          <div class="fd-form-section-body">
            <div class="fd-field">
              <label class="fd-field-label" for="ap-name">Name</label>
              <input class="fd-input" id="ap-name" name="name" value="Quarry console">
            </div>
            <div class="fd-field">
              <label class="fd-field-label" for="ap-2fa">Two-step sign-in</label>
              <div class="fd-select">
                <select id="ap-2fa" name="two_factor">
                  <option value="off">Off</option>
                  <option value="optional" selected>Optional</option>
                </select>
              </div>
            </div>
          </div>
        </section>
        <div class="fd-form-actions">
          <a class="fd-btn" data-variant="ghost" href="heads.html">Cancel</a>
          <button type="submit" class="fd-btn" data-variant="primary">Register app</button>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
