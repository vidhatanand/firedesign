<!doctype html>
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Ember</title>
<link rel="stylesheet" href="../../../../../fire/fire.css">
<script type="module" src="../../../../../fire/fire.js"></script>
</head>
<body>
<main class="fd-page">
  <div class="fd-frame">
    <section class="fd-band fd-page-hero">
      <h1 class="fd-display">Profile</h1>
      <p class="fd-page-hero-desc">How your name appears to the team.</p>
    </section>
    <section class="fd-band" aria-label="Display name">
      <div class="fd-card">
        <form class="fd-form">
        <div class="fd-field">
          <label class="fd-field-label" for="pf-name">Display name</label>
          <div class="fd-row" data-align="end" data-gap="2">
            <input class="fd-input" id="pf-name" type="text" value="Maya Chen" autocomplete="off">
            <button class="fd-btn" type="button">Save</button>
          </div>
          <p class="fd-field-hint">Shown on runs and in the audit log.</p>
        </div>
        </form>
      </div>
    </section>
  </div>
</main>
</body>
</html>
