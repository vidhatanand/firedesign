<!doctype html>
<!-- The floor of fire slim: one page with a field, a button and a toast, no shell. scripts/test/slim.test.mjs slims
     it and loads the result; fire.css and fire.js below are the slim output, written next to this file. -->
<html lang="en" data-fd-surface="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite · Ember</title>
<link rel="stylesheet" href="./.fire-slim/fire.css">
<script type="importmap">{ "imports": { "fire-design": "./.fire-slim/fire.js" } }</script>
<script type="module" src="./main.js"></script>
</head>
<body>
<main>
  <form id="invite">
    <div class="fd-field">
      <label class="fd-field-label" for="invite-email">Email</label>
      <input class="fd-input" id="invite-email" type="email" placeholder="maya@northwind.dev" autocomplete="off">
    </div>
    <button class="fd-btn" data-variant="primary" type="submit">Send invite</button>
  </form>
</main>
</body>
</html>
